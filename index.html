<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Connect Four</h1>
    <div id="game-modes">
        <label>
            <input type="radio" name="gameMode" value="pvp" checked onchange="setGameMode('pvp')"> Player vs Player
        </label>
        <label>
            <input type="radio" name="gameMode" value="pve" onchange="setGameMode('pve')"> Player vs AI
        </label>
        <div id="ai-difficulty-container" style="display: none; margin-left: 15px; display: inline-block;">
            <label for="ai-difficulty">Difficulty:</label>
            <select id="ai-difficulty" onchange="setDifficulty()">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>
    </div>
    <div id="game-board"></div>
    <div id="status">Player 1's Turn (Red)</div>
    <button onclick="resetGame()">Reset Game</button>
    <script src="script.js"></script>
</body>
</html>
